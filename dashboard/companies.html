<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Companies · Job Sniper</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body data-page="companies">
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Companies</h1>
          <p>Categorized company list with best contact, reach points, route, and pitch angle.</p>
        </div>
        <div class="meta" data-sync-meta></div>
      </header>
      <nav class="nav">
        <a href="./index.html">Overview</a>
        <a class="active" href="./companies.html">Companies</a>
        <a href="./jobs.html">Active Jobs</a>
        <a href="./outreach.html">Sent</a>
        <a href="./pipeline.html">Pipeline</a>
      </nav>
      <section class="stats-grid" data-stats></section>
      <section class="panel">
        <div class="section-head">
          <h2>Tracked companies</h2>
          <p>Search by company name, email, stage, route, or note.</p>
        </div>
        <div class="toolbar">
          <input data-search type="search" placeholder="Search companies">
          <select data-filter>
            <option value="all">All categories</option>
            <option value="apply_now">Apply now</option>
            <option value="cold_email">Cold email</option>
            <option value="watch">Watch</option>
            <option value="discard">Discard</option>
          </select>
        </div>
        <div class="card-list" data-list></div>
      </section>
      <section data-error></section>
    </main>
    <script type="module" src="./assets/app.js"></script>
  </body>
  </html>
