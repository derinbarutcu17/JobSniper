<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Active Jobs · Job Sniper</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body data-page="jobs">
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Active Jobs</h1>
          <p>Current open roles that are still live in the operating queue.</p>
        </div>
        <div class="meta" data-sync-meta></div>
      </header>
      <nav class="nav">
        <a href="./index.html">Overview</a>
        <a href="./companies.html">Companies</a>
        <a class="active" href="./jobs.html">Active Jobs</a>
        <a href="./outreach.html">Sent</a>
        <a href="./pipeline.html">Pipeline</a>
      </nav>
      <section class="stats-grid" data-stats></section>
      <section class="panel">
        <div class="section-head">
          <h2>Open job queue</h2>
          <p>Only active records, not already rejected or archived.</p>
        </div>
        <div class="toolbar">
          <input data-search type="search" placeholder="Search jobs">
          <select data-filter>
            <option value="all">All statuses</option>
            <option value="discovered">Discovered</option>
            <option value="contacted">Contacted</option>
            <option value="reply_received">Reply received</option>
            <option value="interviewing">Interviewing</option>
          </select>
        </div>
        <div class="card-list" data-list></div>
      </section>
      <section data-error></section>
    </main>
    <script type="module" src="./assets/app.js"></script>
  </body>
  </html>
