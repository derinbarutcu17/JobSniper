<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sent Outreach · Job Sniper</title>
    <link rel="stylesheet" href="./assets/styles.css">
  </head>
  <body data-page="outreach">
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <h1>Sent</h1>
          <p>Everything already emailed or applied to, in one page.</p>
        </div>
        <div class="meta" data-sync-meta></div>
      </header>
      <nav class="nav">
        <a href="./index.html">Overview</a>
        <a href="./companies.html">Companies</a>
        <a href="./jobs.html">Active Jobs</a>
        <a class="active" href="./outreach.html">Sent</a>
        <a href="./pipeline.html">Pipeline</a>
      </nav>
      <section class="stats-grid" data-stats></section>
      <section class="panel">
        <div class="section-head">
          <h2>Outreach log</h2>
          <p>Email sends and applications from the same operating state.</p>
        </div>
        <div class="toolbar">
          <input data-search type="search" placeholder="Search sent items">
          <select data-filter>
            <option value="all">All types</option>
            <option value="email">Email</option>
            <option value="application">Application</option>
          </select>
        </div>
        <div class="card-list" data-list></div>
      </section>
      <section data-error></section>
    </main>
    <script type="module" src="./assets/app.js"></script>
  </body>
  </html>
